<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LION CHEATS - Key Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e14; color: #e1e7ed; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #151a23; border: 1px solid #242c3d; border-radius: 12px; }
        .table { color: #e1e7ed; }
        .table-dark { --bs-table-bg: #151a23; }
        .btn-cyan { background-color: #00e5ff; color: #000; font-weight: 600; }
        .btn-cyan:hover { background-color: #00b8d4; color: #000; }
        .badge-active { background-color: #00c853; color: #000; }
        .badge-banned { background-color: #d50000; color: #fff; }
        .badge-expired { background-color: #ffab00; color: #000; }
        .badge-unused { background-color: #29b6f6; color: #000; }
    </style>
</head>
<body class="p-4">
    <div class="container">
        
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="row justify-content-center my-5">
            <div class="col-md-5">
                <div class="card p-4 shadow-lg text-center">
                    <h3 class="mb-3 text-cyan"><i class="fa-solid fa-shield-halved me-2"></i>ADMIN LOGIN</h3>
                    <p class="text-muted small">Enter Admin Secret Key to access Dashboard</p>
                    <div class="mb-3">
                        <input type="password" id="adminSecretInput" class="form-control text-center" placeholder="Admin Secret Key">
                    </div>
                    <button class="btn btn-cyan w-100" onclick="loginAdmin()">LOGIN</button>
                    <div id="loginMsg" class="mt-3 text-danger small"></div>
                </div>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fa-solid fa-key me-2 text-cyan"></i>LION CHEATS - KEY MANAGER</h2>
                <button class="btn btn-outline-danger btn-sm" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
            </div>

            <!-- STATS CARDS -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card p-3 text-center">
                        <h6 class="text-muted">Total Keys</h6>
                        <h3 id="statTotal" class="text-cyan mb-0">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 text-center">
                        <h6 class="text-muted">Active Keys</h6>
                        <h3 id="statActive" class="text-success mb-0">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 text-center">
                        <h6 class="text-muted">Banned Keys</h6>
                        <h3 id="statBanned" class="text-danger mb-0">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 text-center">
                        <h6 class="text-muted">Expired Keys</h6>
                        <h3 id="statExpired" class="text-warning mb-0">0</h3>
                    </div>
                </div>
            </div>

            <!-- GENERATE KEY FORM -->
            <div class="card p-4 mb-4">
                <h5 class="mb-3 text-cyan"><i class="fa-solid fa-plus-circle me-2"></i>Generate New License Key</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Duration (Days)</label>
                        <select id="keyDuration" class="form-select">
                            <option value="1">1 Day</option>
                            <option value="7">7 Days</option>
                            <option value="30" selected>30 Days</option>
                            <option value="365">365 Days (1 Year)</option>
                            <option value="9999">Lifetime</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Custom Key Name (Optional)</label>
                        <input type="text" id="customKeyInput" class="form-control" placeholder="Leave empty for auto-generated">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Note / Customer Name</label>
                        <input type="text" id="keyNote" class="form-control" placeholder="e.g. Rahul User">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-cyan w-100" onclick="generateKey()">Create Key</button>
                    </div>
                </div>
            </div>

            <!-- KEYS TABLE -->
            <div class="card p-4">
                <h5 class="mb-3 text-cyan"><i class="fa-solid fa-list me-2"></i>All Generated Keys</h5>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>License Key</th>
                                <th>Duration</th>
                                <th>Status</th>
                                <th>HWID Bound</th>
                                <th>Expires At</th>
                                <th>Note</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="keysTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let adminKey = localStorage.getItem('lion_admin_key') || '';

        if (adminKey) {
            verifySavedKey();
        }

        async function verifySavedKey() {
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_key: adminKey })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showDashboard();
                } else {
                    localStorage.removeItem('lion_admin_key');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loginAdmin() {
            const key = document.getElementById('adminSecretInput').value.trim();
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_key: key })
            });
            const data = await res.json();
            if (data.status === 'success') {
                adminKey = key;
                localStorage.setItem('lion_admin_key', adminKey);
                showDashboard();
            } else {
                document.getElementById('loginMsg').innerText = data.message;
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('lion_admin_key');
            adminKey = '';
            document.getElementById('loginSection').classList.remove('d-none');
            document.getElementById('dashboardSection').classList.add('d-none');
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('dashboardSection').classList.remove('d-none');
            loadKeys();
        }

        async function loadKeys() {
            const res = await fetch(`/api/admin/keys?admin_key=${encodeURIComponent(adminKey)}`);
            const data = await res.json();
            if (data.status === 'success') {
                renderTable(data.keys);
            }
        }

        function renderTable(keys) {
            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = '';

            let activeCount = 0, bannedCount = 0, expiredCount = 0;

            keys.forEach((k, index) => {
                let statusBadge = '<span class="badge badge-active">Active</span>';
                if (k.status === 'banned') {
                    statusBadge = '<span class="badge badge-banned">Banned</span>';
                    bannedCount++;
                } else if (!k.expires_at) {
                    statusBadge = '<span class="badge badge-unused">Unused</span>';
                    activeCount++;
                } else if (new Date() > new Date(k.expires_at)) {
                    statusBadge = '<span class="badge badge-expired">Expired</span>';
                    expiredCount++;
                } else {
                    activeCount++;
                }

                const expiryText = k.expires_at ? new Date(k.expires_at).toLocaleString() : 'Not Activated Yet';
                const hwidText = k.hwid ? `<span class="badge bg-secondary">${k.hwid.substring(0, 10)}...</span>` : '<span class="text-muted small">None</span>';

                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong class="text-cyan">${k.key}</strong> <button class="btn btn-sm text-muted p-0 ms-1" onclick="navigator.clipboard.writeText('${k.key}')"><i class="fa-solid fa-copy"></i></button></td>
                        <td>${k.duration_days} Days</td>
                        <td>${statusBadge}</td>
                        <td>${hwidText} ${k.hwid ? `<button class="btn btn-sm btn-outline-warning py-0 ms-1" onclick="resetHwid(${k.id})">Reset</button>` : ''}</td>
                        <td><small>${expiryText}</small></td>
                        <td><small class="text-muted">${k.note || '-'}</small></td>
                        <td>
                            <button class="btn btn-sm ${k.status === 'banned' ? 'btn-outline-success' : 'btn-outline-warning'} py-0 me-1" onclick="toggleBan(${k.id}, '${k.status}')">${k.status === 'banned' ? 'Unban' : 'Ban'}</button>
                            <button class="btn btn-sm btn-outline-danger py-0" onclick="deleteKey(${k.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('statTotal').innerText = keys.length;
            document.getElementById('statActive').innerText = activeCount;
            document.getElementById('statBanned').innerText = bannedCount;
            document.getElementById('statExpired').innerText = expiredCount;
        }

        async function generateKey() {
            const duration = document.getElementById('keyDuration').value;
            const custom_key = document.getElementById('customKeyInput').value.trim();
            const note = document.getElementById('keyNote').value.trim();

            const res = await fetch('/api/admin/create-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_key: adminKey, duration_days: duration, custom_key, note })
            });

            const data = await res.json();
            if (data.status === 'success') {
                document.getElementById('customKeyInput').value = '';
                document.getElementById('keyNote').value = '';
                loadKeys();
            } else {
                alert(data.message);
            }
        }

        async function resetHwid(id) {
            if (!confirm('Reset HWID for this user key?')) return;
            await fetch('/api/admin/reset-hwid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_key: adminKey, id })
            });
            loadKeys();
        }

        async function toggleBan(id, currentStatus) {
            await fetch('/api/admin/toggle-ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_key: adminKey, id, status: currentStatus })
            });
            loadKeys();
        }

        async function deleteKey(id) {
            if (!confirm('Delete this key permanently?')) return;
            await fetch('/api/admin/delete-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_key: adminKey, id })
            });
            loadKeys();
        }
    </script>
</body>
</html>
